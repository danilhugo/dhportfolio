<!DOCTYPE html>
<!-- Calculator project page for the DH portfolio. -->
<html lang="en">
<head>
    <!-- Page metadata and viewport settings support desktop and mobile screens. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        /* Center the calculator on a soft portfolio-style background. */
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        /* Calculator panel provides the main visual boundary. */
        .calculator {
            width: min(90vw, 340px);
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        /* Display shows the current expression or result. */
        #display {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 16px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
            color: #111827;
            font-size: 24px;
            text-align: right;
        }

        /* Arrange calculator controls into a consistent four-column grid. */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Shared button styling keeps every key the same size. */
        button {
            min-height: 52px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Operator keys use a contrasting color for quick scanning. */
        button.operator {
            background: #eb8b25;
        }

        /* The clear key uses a warning color to distinguish reset behavior. */
        button.clear {
            background: #dc3545;
        }

        /* Make the zero key span two columns. */
        button.zero {
            grid-column: span 2;
        }

        /* Provide visual feedback while a key is pressed. */
        button:hover {
            filter: brightness(0.9);
        }
    </style>
</head>
<body>
    <!-- Calculator interface contains the display and keypad controls. -->
    <main class="calculator">
        <h1>Calculator</h1>
        <!-- Read-only display prevents direct entry of unsupported expressions. -->
        <input id="display" type="text" value="0" aria-label="Calculator display" readonly>
        <!-- Keypad contains digits, operators, reset, and equals controls. -->
        <div class="keypad">
            <button class="clear" type="button" data-action="clear">C</button>
            <button class="operator" type="button" data-value="/">÷</button>
            <button class="operator" type="button" data-value="*">×</button>
            <button class="operator" type="button" data-value="-">−</button>
            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button class="operator" type="button" data-value="+">+</button>
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value=".">.</button>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button class="operator" type="button" data-action="calculate">=</button>
            <button class="zero" type="button" data-value="0">0</button>
        </div>
    </main>
    <script>
        // Store the current calculator expression separately from the display text.
        const display = document.querySelector('#display');
        let expression = '';

        // Safely calculate expressions containing only numbers and basic operators.
        function calculateExpression() {
            if (!/^[0-9+*/. -]+$/.test(expression) || !/[0-9]/.test(expression)) return;
            try {
                const result = Function(`"use strict"; return (${expression})`)();
                if (!Number.isFinite(result)) throw new Error('Invalid result');
                expression = String(result);
                display.value = expression;
            } catch {
                expression = '';
                display.value = 'Error';
            }
        }

        // Handle number, operator, clear, and equals button actions.
        document.querySelectorAll('button').forEach((button) => {
            button.addEventListener('click', () => {
                if (button.dataset.action === 'clear') {
                    expression = '';
                    display.value = '0';
                    return;
                }
                if (button.dataset.action === 'calculate') {
                    calculateExpression();
                    return;
                }
                expression += button.dataset.value;
                display.value = expression;
            });
        });
    </script>
</body>
</html>
